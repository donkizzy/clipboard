name: Clipboard

options:
  bundleIdPrefix: com.amosgodwin
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_MODULE_VERIFIER: NO

targets:
  Clipboard:
    type: application
    platform: macOS
    sources:
      - path: Clipboard
    info:
      path: Clipboard/App/Info.plist
      properties:
        CFBundleDisplayName: Clipboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "Copyright © 2026 Amos Godwin. MIT License."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amosgodwin.Clipboard
        PRODUCT_NAME: Clipboard
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  ClipboardTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipboardTests
    dependencies:
      - target: Clipboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amosgodwin.ClipboardTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Clipboard.app/Contents/MacOS/Clipboard

schemes:
  Clipboard:
    build:
      targets:
        Clipboard: all
        ClipboardTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "--demo": true
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Clipboard
      targets:
        - ClipboardTests
    archive:
      config: Release
