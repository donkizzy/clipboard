name: macOS verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Run unit tests
        run: ./scripts/test.sh
      - name: Build and verify a universal local candidate
        run: ./scripts/package-release.sh
